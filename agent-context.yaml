# ----------------------------------------------------------------------
# Project Context (schema-enforced)
# ----------------------------------------------------------------------
# Rules:
# - Sections `project`, `runtime`, and `stack` must exist.
# - These sections are primarily maintained by humans.
# - AI agents may freely extend ONLY the `agentNotes` section, and may
#   edit core sections only when explicitly instructed.
# ----------------------------------------------------------------------

version: 1.0.0
lastUpdated: "2026-10-18"

project:
  name: "job-scout"
  description: "Agent skill: resume → confirmed search brief → roles open today on employer job boards (Greenhouse, Ashby, Lever), linked straight to the employer, with fit reasons quoted from each job description."
  type: "agent-skill"
  visibility: private     # public at M6, by the maintainer only

runtime:
  primary: "python"
  language: "python3"     # standard library only; floor 3.9 (macOS /usr/bin/python3)
  target: "claude.ai code sandbox, Claude Code, Codex"

stack:
  frameworks: {}
  tools:
    python: "skills/job-scout/scripts/* (shipped), scripts/* (maintainer + CI only)"
    tests: "unittest (stdlib), offline via recorded HTTP fixtures"
  aiProviders: []

entryPoints: ["skills/job-scout/SKILL.md"]
directories:
  source: skills/job-scout/
  public: ""
  distribution: dist/

ai:
  enabled: false
  usage: []
  notes: []
  memoryPolicy:
    logTo: .kerby/memory.log
    maxEntries: 200
  planThreshold: 4

knowledge:
  enabled: true

preferences: {}
status:
  editableBy: [human, ai]
  changePolicy: append-log
  lastEditedBy: ai

agentNotes:
  commands:
    build: "python3 -m compileall -q skills scripts tests"
    lint: "python3 scripts/check-skill-compat.py"
    test: "python3 -m unittest discover -s tests -t ."
  constraints:
    - "No third-party packages anywhere in skills/job-scout/ — it must run unmodified with no pip."
    - "No tomllib, no match statements, no runtime X | Y unions (Python 3.9 floor)."
    - "Never name a module after a stdlib package (e.g. net.py, not http.py)."
  plan: "implementation-plan.yaml (phases → milestones → tasks)"
  mergePolicy:
    # Granted by the maintainer in session on 2026-10-19. This overrides swe's
    # "Do NOT merge — leave for human review" for milestone PRs in this repo only.
    authorizedBy: "maintainer, in session, 2026-10-19"
    scope: "milestone PRs from implementation-plan.yaml (M1b–M6), into main"
    method: "squash merge, then delete the head branch"
    when: "agent's judgement once satisfied with the code: CI green on 3.9 + 3.13; every Codex review finding fixed or answered with a reason, threads resolved; a fresh skill-evaluator verdict recorded for any PR touching SKILL.md or files it loads; the milestone's case table has evidence per row"
    waitForCodex: "agent's judgement; Codex suggestions are applied only when verified correct"
    stopAndAsk:
      - "a task that needs the maintainer (G8 claude.ai upload, V4 ground-truth labelling, M6 going public / release / surface smoke tests)"
      - "the approved plan would change (a plan amendment voids prior grade-7 approval)"
      - "the same review or eval failure class recurs after a fix round (skill-authoring circuit breaker)"
      - "skill-evaluator is unavailable (an unverified skill change needs the maintainer's acceptance)"
    neverWithoutAsking: "making the repo public, publishing a release, force-pushing, rewriting main's history"
